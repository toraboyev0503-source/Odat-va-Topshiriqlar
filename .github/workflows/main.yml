name: Memora 0.9.38 Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_android_tests:
        description: 'Run Room migration tests on Android emulator'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: memora-0938-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct Memora 0.9.38 ZIP from archived 0.9.37
        shell: bash
        run: |
          set -euo pipefail
          archive=Memora_0.9.38_GitHub.zip
          if [[ ! -f "$archive" ]]; then
            echo 'Restoring 0.9.37 from Git history and applying verified 0.9.38 delta'
            git show 13c6fd299:Memora_0.9.37_GitHub_path_fixed.zip > "$RUNNER_TEMP/memora_0937.zip"
            echo '61c12f26235c6b5b5100cd302e22cf66415343ea551f342ae83c3711beda78c1  '"$RUNNER_TEMP/memora_0937.zip" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/memora_rebuild"
            unzip -q "$RUNNER_TEMP/memora_0937.zip" -d "$RUNNER_TEMP/memora_rebuild"
            test -f ci/Memora_0.9.38_delta.b64
            echo '801cfcbbefaf1fdbcf439d06610aef3d1f7132d7583fda7ae755b2de7b20b594  ci/Memora_0.9.38_delta.b64' | sha256sum -c -
            base64 -d ci/Memora_0.9.38_delta.b64 | xz -dc | patch --batch -s -p1 -d "$RUNNER_TEMP/memora_rebuild"
            (cd "$RUNNER_TEMP/memora_rebuild" && zip -qr "$GITHUB_WORKSPACE/$archive" .)
          fi
          unzip -tq "$archive" | tail -2
          mkdir -p "$RUNNER_TEMP/memora_0938_source"
          unzip -q "$archive" -d "$RUNNER_TEMP/memora_0938_source"
          project_dir="$RUNNER_TEMP/memora_0938_source"
          test -f "$project_dir/settings.gradle.kts"
          test -f "$project_dir/tools/regression_0938.py"
          grep -q 'versionCode = 59' "$project_dir/app/build.gradle.kts"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
      - name: Publish full source ZIP in GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch Memora_0.9.38_GitHub.zip >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Memora_0.9.38_GitHub.zip
            git commit -m 'Add Memora 0.9.38 full source ZIP [skip ci]'
            git push origin HEAD:main || echo '::warning::ZIP generated but repository push was denied; download source artifact instead.'
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Code and visual regression
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 tools/regression_0938.py
          python3 tools/verify_topilma_card_0931.py
          python3 tools/verify_topilma_icons_0931.py
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Billing backend tests
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: npm test
      - name: Compile, unit tests, lint and APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.38-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload generated source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.38-source
          path: Memora_0.9.38_GitHub.zip
          if-no-files-found: warn
          retention-days: 14

  android-migration-test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Memora_0.9.38_GitHub.zip ]]; then
            unzip -q Memora_0.9.38_GitHub.zip -d "$RUNNER_TEMP/memora_0938_source"
          else
            git show 13c6fd299:Memora_0.9.37_GitHub_path_fixed.zip > "$RUNNER_TEMP/memora_0937.zip"
            mkdir -p "$RUNNER_TEMP/memora_0938_source"
            unzip -q "$RUNNER_TEMP/memora_0937.zip" -d "$RUNNER_TEMP/memora_0938_source"
            base64 -d ci/Memora_0.9.38_delta.b64 | xz -dc | patch --batch -s -p1 -d "$RUNNER_TEMP/memora_0938_source"
          fi
          echo "PROJECT_DIR=$RUNNER_TEMP/memora_0938_source" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Room migration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
