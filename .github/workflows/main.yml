name: Memora 0.9.40 Android Build

on:
  push:
    branches: [main, memora-0940-build]
  workflow_dispatch:
    inputs:
      run_android_tests:
        description: Run Room migration tests on emulator
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: memora-0940-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and verify Memora 0.9.40 source
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/memora_0940_source"
          mkdir -p "$project_dir"
          if [[ -f Memora_0.9.40_GitHub.zip ]]; then
            echo 'Using full Memora 0.9.40 ZIP in repository'
            unzip -q Memora_0.9.40_GitHub.zip -d "$project_dir"
          elif [[ -f Memora_0.9.39_GitHub.zip ]]; then
            echo 'Reconstructing Memora 0.9.40 from the previous source ZIP and patch'
            unzip -q Memora_0.9.39_GitHub.zip -d "$project_dir"
            if ! (base64 -d ci/Memora_0.9.40_delta_fixed.b64 | xz -dc | patch --batch --forward --fuzz=0 -s -p1 -d "$project_dir"); then
              echo 'Fixed-baseline patch did not apply; retrying the original-baseline patch'
              rm -rf "$project_dir"
              mkdir -p "$project_dir"
              unzip -q Memora_0.9.39_GitHub.zip -d "$project_dir"
              base64 -d ci/Memora_0.9.40_delta.b64 | xz -dc | patch --batch --forward --fuzz=0 -s -p1 -d "$project_dir"
            fi
          else
            echo '::error::Missing source archives; need Memora_0.9.39_GitHub.zip or Memora_0.9.40_GitHub.zip'
            exit 1
          fi
          test -f "$project_dir/settings.gradle.kts"
          test -f "$project_dir/tools/regression_0940.py"
          grep -q 'versionCode = 61' "$project_dir/app/build.gradle.kts"
          PROJECT_DIR="$project_dir" python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path(os.environ['PROJECT_DIR'])
          files = sorted(p for p in root.rglob('*') if p.is_file())
          h = hashlib.sha256()
          for p in files:
              rel = p.relative_to(root).as_posix().encode('utf-8')
              h.update(len(rel).to_bytes(4, 'big'))
              h.update(rel)
              h.update(p.read_bytes())
          digest = h.hexdigest()
          print('Verified source files:', len(files), 'tree SHA-256:', digest)
          assert len(files) == 261, f'Unexpected file count: {len(files)}'
          assert digest == '7e8fffe6849460a3e39e4a05ff52fd9946629c90a2a902571deae955aa7e2ee0', 'Source mismatch'
          PY
          if [[ ! -f Memora_0.9.40_GitHub.zip ]]; then
            (cd "$project_dir" && zip -qr "$GITHUB_WORKSPACE/Memora_0.9.40_GitHub.zip" .)
          fi
          unzip -tq Memora_0.9.40_GitHub.zip | tail -2
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Source regression
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/regression_0940.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Billing backend tests
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: npm test

      - name: Compile, unit tests, lint, and APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.40-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish full Memora 0.9.40 ZIP to repository
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch Memora_0.9.40_GitHub.zip >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Memora_0.9.40_GitHub.zip
            git commit -m 'Add Memora 0.9.40 verified full source ZIP [skip ci]'
            git push origin HEAD:main
          fi

      - name: Upload Room schema snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.40-room-schemas
          path: ${{ env.PROJECT_DIR }}/app/schemas/com.memora.app.data.local.AppDatabase/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload full source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.40-source
          path: Memora_0.9.40_GitHub.zip
          if-no-files-found: warn
          retention-days: 14

  android-migration-test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore source for emulator
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/memora_0940_source"
          mkdir -p "$project_dir"
          if [[ -f Memora_0.9.40_GitHub.zip ]]; then
            unzip -q Memora_0.9.40_GitHub.zip -d "$project_dir"
          else
            unzip -q Memora_0.9.39_GitHub.zip -d "$project_dir"
            if ! (base64 -d ci/Memora_0.9.40_delta_fixed.b64 | xz -dc | patch --batch --forward --fuzz=0 -s -p1 -d "$project_dir"); then
              rm -rf "$project_dir"
              mkdir -p "$project_dir"
              unzip -q Memora_0.9.39_GitHub.zip -d "$project_dir"
              base64 -d ci/Memora_0.9.40_delta.b64 | xz -dc | patch --batch --forward --fuzz=0 -s -p1 -d "$project_dir"
            fi
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android migration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest