name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract SOURCE ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./HabitCore_0.2.0_SOURCE.zip"
          if [ ! -f "${ZIP_FILE}" ]; then
            echo "Required SOURCE ZIP not found: ${ZIP_FILE}"
            exit 1
          fi
          rm -rf _android_project
          mkdir -p _android_project
          unzip -q "${ZIP_FILE}" -d _android_project
          SETTINGS_FILE="$(find _android_project -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          if [ -z "${SETTINGS_FILE}" ]; then
            echo "settings.gradle(.kts) not found."
            exit 1
          fi
          PROJECT_DIR="$(dirname "${SETTINGS_FILE}")"
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "${GITHUB_ENV}"
          echo "Android project: ${PROJECT_DIR}"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests
        run: gradle -p "${PROJECT_DIR}" testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle -p "${PROJECT_DIR}" lintDebug --stacktrace

      - name: Build Debug APK
        run: gradle -p "${PROJECT_DIR}" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitCore-0.2.0-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
