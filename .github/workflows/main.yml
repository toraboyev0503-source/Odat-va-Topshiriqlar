name: Memora 0.9.37 Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_android_tests:
        description: "Run on Android emulator (migration test)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Locate or unpack Memora source code
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/regression_0937.py && -f settings.gradle.kts ]]; then
            project_dir="$GITHUB_WORKSPACE"
            echo "Source: checkout root"
          elif [[ -f Memora-0.9.37/tools/regression_0937.py && -f Memora-0.9.37/settings.gradle.kts ]]; then
            project_dir="$GITHUB_WORKSPACE/Memora-0.9.37"
            echo "Source: checkout subfolder"
          else
            archive=""
            for candidate in \
              Memora_0.9.37_GitHub_path_fixed.zip \
              Memora_0.9.37_GitHub_SDK_fix.zip \
              Memora_0.9.37_GitHub.zip; do
              if [[ -f "$candidate" ]]; then
                archive="$candidate"
                break
              fi
            done
            if [[ -z "$archive" ]]; then
              echo "::error title=Source ZIP missing::No Memora 0.9.37 source files or known ZIP found at repository root."
              find . -maxdepth 2 -type f -not -path './.git/*' | sort | head -60
              exit 1
            fi
            project_dir="$RUNNER_TEMP/memora_0937_source"
            mkdir -p "$project_dir"
            unzip -q "$archive" -d "$project_dir"
            echo "Source: unpacked $archive"
            if [[ -f "$project_dir/Memora-0.9.37/settings.gradle.kts" ]]; then
              project_dir="$project_dir/Memora-0.9.37"
            fi
          fi
          if [[ ! -f "$project_dir/settings.gradle.kts" || ! -f "$project_dir/tools/regression_0937.py" ]]; then
            echo "::error title=Invalid source ZIP::Missing settings.gradle.kts or tools/regression_0937.py after extraction."
            exit 1
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Verified Memora sources at: $project_dir"
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Code and visual regression
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 tools/regression_0937.py
          python3 tools/verify_topilma_card_0931.py
          python3 tools/verify_topilma_icons_0931.py
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Billing backend tests
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: npm test
      - name: Compile, unit tests, lint and instrumented-test compilation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.37-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload schema 8 for reproducible future migration tests
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.37-generated-room-schemas
          path: ${{ env.PROJECT_DIR }}/app/schemas/com.memora.app.data.local.AppDatabase/*.json
          if-no-files-found: error
          retention-days: 14
  android-migration-test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Locate or unpack Memora source code
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/regression_0937.py && -f settings.gradle.kts ]]; then
            project_dir="$GITHUB_WORKSPACE"
            echo "Source: checkout root"
          elif [[ -f Memora-0.9.37/tools/regression_0937.py && -f Memora-0.9.37/settings.gradle.kts ]]; then
            project_dir="$GITHUB_WORKSPACE/Memora-0.9.37"
            echo "Source: checkout subfolder"
          else
            archive=""
            for candidate in \
              Memora_0.9.37_GitHub_path_fixed.zip \
              Memora_0.9.37_GitHub_SDK_fix.zip \
              Memora_0.9.37_GitHub.zip; do
              if [[ -f "$candidate" ]]; then
                archive="$candidate"
                break
              fi
            done
            if [[ -z "$archive" ]]; then
              echo "::error title=Source ZIP missing::No Memora 0.9.37 source files or known ZIP found at repository root."
              find . -maxdepth 2 -type f -not -path './.git/*' | sort | head -60
              exit 1
            fi
            project_dir="$RUNNER_TEMP/memora_0937_source"
            mkdir -p "$project_dir"
            unzip -q "$archive" -d "$project_dir"
            echo "Source: unpacked $archive"
            if [[ -f "$project_dir/Memora-0.9.37/settings.gradle.kts" ]]; then
              project_dir="$project_dir/Memora-0.9.37"
            fi
          fi
          if [[ ! -f "$project_dir/settings.gradle.kts" || ! -f "$project_dir/tools/regression_0937.py" ]]; then
            echo "::error title=Invalid source ZIP::Missing settings.gradle.kts or tools/regression_0937.py after extraction."
            exit 1
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Verified Memora sources at: $project_dir"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android migration test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
