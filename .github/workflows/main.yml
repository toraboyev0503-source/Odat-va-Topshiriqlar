name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Locate or unpack Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]; then
            ROOT="."
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | sort -V | tail -n 1 || true)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "No Android project or source ZIP found."
              exit 1
            fi
            rm -rf .ci_source
            mkdir -p .ci_source
            unzip -q "$ZIP_FILE" -d .ci_source
            SETTINGS="$(find .ci_source -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1 || true)"
            if [[ -z "$SETTINGS" ]]; then
              echo "The ZIP does not contain settings.gradle(.kts)."
              exit 1
            fi
            ROOT="$(dirname "$SETTINGS")"
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Android project root: $ROOT"

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_ROOT" testDebugUnitTest --stacktrace --no-daemon

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_ROOT" lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_ROOT" assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Topshiriq-Odatlar-0.1.2-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/reports/**
            ${{ env.PROJECT_ROOT }}/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
