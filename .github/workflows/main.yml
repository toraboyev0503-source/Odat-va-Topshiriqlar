name: Memora 0.9.3 Android Build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: memora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate or unpack Android source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f settings.gradle.kts && -d app ]]; then
            echo "project_dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          archive="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name 'Memora-0.9.3-source.zip' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "::error::Memora-0.9.3-source.zip topilmadi. ZIP faylni repository root qismiga yuklang."
            exit 1
          fi

          echo "Using source archive: $archive"
          unzip -tq "$archive" >/dev/null

          work="$RUNNER_TEMP/memora-source"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -q "$archive" -d "$work"

          settings="$(find "$work" -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$settings" ]]; then
            echo "::error::settings.gradle.kts source ZIP ichidan topilmadi."
            exit 1
          fi

          project_dir="$(dirname "$settings")"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Android project: $project_dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make Gradle wrapper executable
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: chmod +x ./gradlew

      - name: Run unit tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run lint
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.3-debug-apk
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
