name: Memora 0.9.35.1 Build

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source
        shell: bash
        run: |
          rm -rf build-src
          mkdir -p build-src

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'Memora-0.9.35.1-source*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Memora 0.9.35.1 source ZIP topilmadi."
            echo "Repository rootdagi ZIP fayllar:"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Using source ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build-src

          GRADLEW="$(find build-src -type f -name gradlew | head -n 1)"
          if [ -z "$GRADLEW" ]; then
            echo "gradlew topilmadi."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.35.1-debug-apk
          path: build-src/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
