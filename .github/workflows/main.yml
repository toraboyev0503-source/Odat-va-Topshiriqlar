name: Memora 0.9.41 Android Build

on:
  push:
    branches: [main, memora-0941-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Memora 0.9.41 sources
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/memora_0941_source"
          mkdir -p "$project_dir"
          if [[ -f Memora_0.9.41_GitHub.zip ]]; then
            unzip -q Memora_0.9.41_GitHub.zip -d "$project_dir"
          else
            unzip -q Memora_0.9.40_GitHub.zip -d "$project_dir"
            cat ci/memora_0941_p{1,2,3,4}.b64 > "$RUNNER_TEMP/memora_patch.b64"
            echo 'e6043124cc04761023746d6d0d2a23f5e98423e7e1553ba395655dd06ae5a3e8  '"$RUNNER_TEMP/memora_patch.b64" | sha256sum -c -
            python3 -m pip install --quiet brotli
            python3 - "$RUNNER_TEMP/memora_patch.b64" "$RUNNER_TEMP/memora_patch.diff" <<'PY'
          import base64, brotli, pathlib, sys
          pathlib.Path(sys.argv[2]).write_bytes(brotli.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_bytes())))
          PY
            patch --batch --fuzz=0 -s -p1 -d "$project_dir" < "$RUNNER_TEMP/memora_patch.diff"
          fi
          test -f "$project_dir/settings.gradle.kts"
          test -f "$project_dir/tools/regression_0941.py"
          grep -q 'versionCode = 62' "$project_dir/app/build.gradle.kts"
          grep -q 'versionName = "0.9.41"' "$project_dir/app/build.gradle.kts"
          echo '82fba8f5ba2acc19759980f64ee9e7f83105df223686db437732287af514b258  '"$project_dir/app/src/main/java/com/memora/app/ui/screens/ReaderScreen.kt" | sha256sum -c -
          echo '610a9d54d8313ebf6348e6a1d9c985551a46483ccd94a4239f9bd55eb53e2c21  '"$project_dir/app/src/main/java/com/memora/app/ui/screens/EditorScreen.kt" | sha256sum -c -
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          if [[ ! -f Memora_0.9.41_GitHub.zip ]]; then
            (cd "$project_dir" && zip -qr "$GITHUB_WORKSPACE/Memora_0.9.41_GitHub.zip" .)
          fi
          unzip -tq Memora_0.9.41_GitHub.zip
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Code regression
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/regression_0941.py
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Billing backend tests
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: npm test
      - name: Kotlin tests, lint and debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.41-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.41-source
          path: Memora_0.9.41_GitHub.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Publish source ZIP to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          if ! git ls-files --error-unmatch Memora_0.9.41_GitHub.zip >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Memora_0.9.41_GitHub.zip
            git commit -m 'Publish Memora 0.9.41 source [skip ci]'
            git push origin HEAD:main
          fi
