name: Memora 0.9.39 Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_android_tests:
        description: 'Run Room migration test on Android emulator'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate or extract 0.9.39 source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Memora_0.9.39_GitHub.zip ]]; then
            project_dir="$RUNNER_TEMP/memora_0939_source"
            mkdir -p "$project_dir"
            unzip -q Memora_0.9.39_GitHub.zip -d "$project_dir"
            echo 'Source: extracted 0.9.39 ZIP from repository root'
          elif [[ -f tools/regression_0939.py && -f settings.gradle.kts ]]; then
            project_dir="$GITHUB_WORKSPACE"
            echo 'Source: extracted files at repository root'
          elif [[ -f Memora-0.9.39/tools/regression_0939.py && -f Memora-0.9.39/settings.gradle.kts ]]; then
            project_dir="$GITHUB_WORKSPACE/Memora-0.9.39"
            echo 'Source: extracted files in Memora-0.9.39 subfolder'
          elif [[ -f Memora_0.9.38_GitHub.zip && -f ci/Memora_0.9.39_delta.b64 ]]; then
            echo 'Restoring verified Memora 0.9.39 sources from Memora 0.9.38 archive and patch'
            echo 'b153cc3b32b6ace187baae9df6e70b84f8d6ad901ad43fb4953aeb60c4737dac  ci/Memora_0.9.39_delta.b64' | sha256sum -c -
            project_dir="$RUNNER_TEMP/memora_0939_source"
            mkdir -p "$project_dir"
            unzip -q Memora_0.9.38_GitHub.zip -d "$project_dir"
            base64 -d ci/Memora_0.9.39_delta.b64 | xz -dc | patch --batch -s -p1 -d "$project_dir"
            test -f "$project_dir/tools/regression_0939.py"
            ( cd "$project_dir" && zip -qr "$GITHUB_WORKSPACE/Memora_0.9.39_GitHub.zip" . )
          else
            echo '::error title=Missing Memora source::Neither 0.9.39 ZIP nor the 0.9.38 ZIP with the 0.9.39 patch was found.'
            find . -maxdepth 2 -type f -not -path './.git/*' | sort | head -50
            exit 1
          fi
          if [[ -f "$project_dir/Memora-0.9.39/settings.gradle.kts" ]]; then
            project_dir="$project_dir/Memora-0.9.39"
          fi
          test -f "$project_dir/settings.gradle.kts" || { echo '::error::settings.gradle.kts missing'; exit 1; }
          test -f "$project_dir/tools/regression_0939.py" || { echo '::error::regression_0939.py missing'; exit 1; }
          grep -q 'versionCode = 60' "$project_dir/app/build.gradle.kts" || { echo '::error::Wrong Memora versionCode'; exit 1; }
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
      - name: Correct navigation-tab nullability in source and ZIP
        shell: bash
        run: |
          set -euo pipefail
          file="$PROJECT_DIR/app/src/main/java/com/memora/app/ui/MemoraApp.kt"
          if grep -Fq 'selected = rootTab,' "$file"; then
            sed -i 's/selected = rootTab,/selected = rootTab ?: RootTab.HOME,/' "$file"
            rm -f Memora_0.9.39_GitHub.zip
            ( cd "$PROJECT_DIR" && zip -qr "$GITHUB_WORKSPACE/Memora_0.9.39_GitHub.zip" . )
          fi
          grep -Fq 'selected = rootTab ?: RootTab.HOME,' "$file"
      - name: Publish corrected Memora 0.9.39 source ZIP in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Memora_0.9.39_GitHub.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Memora 0.9.39 source ZIP Kotlin nullability [skip ci]'
            git push origin HEAD:main || echo '::warning::ZIP was corrected but repository push was denied.'
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Code and visual regression
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 tools/regression_0939.py
          python3 tools/verify_topilma_card_0931.py
          python3 tools/verify_topilma_icons_0931.py
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Billing backend tests
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: npm test
      - name: Compile, unit tests, lint and APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.39-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload full source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.39-source
          path: Memora_0.9.39_GitHub.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Upload generated Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.39-room-schemas
          path: ${{ env.PROJECT_DIR }}/app/schemas/com.memora.app.data.local.AppDatabase/*.json
          if-no-files-found: error
          retention-days: 14

  android-migration-test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate or extract 0.9.39 source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Memora_0.9.39_GitHub.zip ]]; then
            project_dir="$RUNNER_TEMP/memora_0939_source"
            mkdir -p "$project_dir"
            unzip -q Memora_0.9.39_GitHub.zip -d "$project_dir"
          elif [[ -f tools/regression_0939.py && -f settings.gradle.kts ]]; then
            project_dir="$GITHUB_WORKSPACE"
          elif [[ -f Memora-0.9.39/settings.gradle.kts ]]; then
            project_dir="$GITHUB_WORKSPACE/Memora-0.9.39"
          elif [[ -f Memora_0.9.38_GitHub.zip && -f ci/Memora_0.9.39_delta.b64 ]]; then
            project_dir="$RUNNER_TEMP/memora_0939_source"
            mkdir -p "$project_dir"
            echo 'b153cc3b32b6ace187baae9df6e70b84f8d6ad901ad43fb4953aeb60c4737dac  ci/Memora_0.9.39_delta.b64' | sha256sum -c -
            unzip -q Memora_0.9.38_GitHub.zip -d "$project_dir"
            base64 -d ci/Memora_0.9.39_delta.b64 | xz -dc | patch --batch -s -p1 -d "$project_dir"
          else
            echo '::error::Memora 0.9.39 source not found'
            exit 1
          fi
          if [[ -f "$project_dir/Memora-0.9.39/settings.gradle.kts" ]]; then
            project_dir="$project_dir/Memora-0.9.39"
          fi
          test -f "$project_dir/settings.gradle.kts"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Room migration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest