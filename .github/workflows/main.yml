        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Extract Memora source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          archive="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'Memora-*-source.zip' | sort -V | tail -n 1)"

          if [ -z "$archive" ]; then
            echo "::error::Repository root ichida Memora-*-source.zip topilmadi."
            exit 1
          fi

          echo "Using: $(basename "$archive")"

          work="$RUNNER_TEMP/memora-source"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -q "$archive" -d "$work"

          settings="$(find "$work" -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$settings" ]; then
            echo "::error::ZIP ichida settings.gradle.kts topilmadi."
            exit 1
          fi

          project_dir="$(dirname "$settings")"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Android project: $project_dir"

      - name: Make Gradle wrapper executable
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: chmod +x ./gradlew

      - name: Run Memora regression checks
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          [ -f tools/verify_topilma_card_0931.py ] && python3 tools/verify_topilma_card_0931.py
          [ -f tools/verify_topilma_icons_0931.py ] && python3 tools/verify_topilma_icons_0931.py
          [ -f tools/regression_0932.py ] && python3 tools/regression_0932.py

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.32-debug-apk
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
