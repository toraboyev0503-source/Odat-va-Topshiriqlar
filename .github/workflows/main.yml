name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 36.1
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME is not set." >&2
            exit 1
          fi

          # API 36.1 is a stable SDK package (Android 16 QPR2).
          # Use the stable Android 16 QPR2 SDK required by current dependencies.
          for attempt in 1 2 3; do
            sdkmanager \
              "platform-tools" \
              "platforms;android-36.1" \
              "build-tools;36.0.0" || true

            if [ -f "$SDK_ROOT/platforms/android-36.1/android.jar" ] && \
               [ -x "$SDK_ROOT/build-tools/36.0.0/aapt2" ]; then
              echo "Android SDK 36.1 installed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "SDK install verification failed; retrying ($attempt/3)..." >&2
              sleep 10
            fi
          done

          echo "Android SDK package installation failed after 3 attempts." >&2
          echo "Available 36.x platform packages:" >&2
          sdkmanager --list 2>/dev/null | grep -E 'platforms;android-36([.;]|$)' || true
          exit 1

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Verify project and toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f "$SDK_ROOT/platforms/android-36.1/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt2"
          grep -F 'version "9.3.0"' build.gradle.kts
          grep -F 'version = release(36)' app/build.gradle.kts
          grep -F 'minorApiLevel = 1' app/build.gradle.kts
          java -version
          gradle --version

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace --warning-mode all --console=plain

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace --warning-mode all --console=plain

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace --warning-mode all --console=plain

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VaqtBlok-0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaqtBlok-0.1.0-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
 
