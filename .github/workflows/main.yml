name: Memora 0.9.35.1 Build

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source
        shell: bash
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q Memora-0.9.35.1-source.zip -d build-src
          test -f build-src/Memora-0.9.35.1/gradlew

      - name: Verify frozen Topilma card and compatibility changes
        shell: bash
        working-directory: build-src/Memora-0.9.35.1
        run: |
          python3 tools/verify_topilma_card_0931.py
          python3 tools/verify_topilma_icons_0931.py
          python3 tools/regression_09351.py

      - name: Build debug APK
        shell: bash
        working-directory: build-src/Memora-0.9.35.1
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.35.1-debug-apk
          path: build-src/Memora-0.9.35.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
