name: Memora 0.9.43 Android Build

on:
  push:
    branches: [memora-0943-build]
  workflow_dispatch:
    inputs:
      run_android_tests:
        description: Run Android migration tests on emulator
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: memora-0943-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and verify Memora 0.9.43 source
        shell: bash
        run: |
          set -euo pipefail
          test -f Memora_0.9.42_GitHub.zip
          echo 'Using 0.9.42 source ZIP already in repository; verifying patch compatibility with dry-run'
          cat ci/patch_0943_{0,1,2,3}.b64 > "$RUNNER_TEMP/patch_0943.b64"
          echo '0e930272c744fc5405b0ed8b32bed4ef478c9b3fafe13dfc87444a924b61e369  '"$RUNNER_TEMP/patch_0943.b64" | sha256sum -c -
          project_dir="$RUNNER_TEMP/memora_0943_source"
          mkdir -p "$project_dir"
          unzip -q Memora_0.9.42_GitHub.zip -d "$project_dir"
          base64 -d "$RUNNER_TEMP/patch_0943.b64" | xz -dc | patch -d "$project_dir" -p1 --batch -s
          python3 ci/fix_0943.py "$project_dir"
          test -f "$project_dir/settings.gradle.kts"
          test -f "$project_dir/tools/regression_0943.py"
          grep -q 'versionCode = 64' "$project_dir/app/build.gradle.kts"
          grep -q 'versionName = "0.9.43"' "$project_dir/app/build.gradle.kts"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Source regression
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 tools/regression_0943.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Billing backend tests
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: npm test
      - name: Compile, unit tests, lint and APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.43-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload full 0.9.43 source archive
        shell: bash
        run: |
          set -euo pipefail
          (cd "$PROJECT_DIR" && zip -qr "$GITHUB_WORKSPACE/Memora_0.9.43_GitHub.zip" .)
          unzip -tq Memora_0.9.43_GitHub.zip | tail -2
      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.43-source
          path: Memora_0.9.43_GitHub.zip
          if-no-files-found: error
          retention-days: 30
      - name: Commit 0.9.43 source ZIP to build branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Memora_0.9.43_GitHub.zip
          git commit -m 'Add Memora 0.9.43 verified source ZIP [skip ci]' || true
          git push origin HEAD:memora-0943-build

  android-migration-test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/memora_0943_source"
          mkdir -p "$project_dir"
          if [[ -f Memora_0.9.43_GitHub.zip ]]; then
            unzip -q Memora_0.9.43_GitHub.zip -d "$project_dir"
          else
            unzip -q Memora_0.9.42_GitHub.zip -d "$project_dir"
            cat ci/patch_0943_{0,1,2,3}.b64 | base64 -d | xz -dc | patch -d "$project_dir" -p1 --batch -s
            python3 ci/fix_0943.py "$project_dir"
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
