name: Memora 0.9.45 Android Build

on:
  push:
    branches: [main, memora-0945-build]
  workflow_dispatch:
    inputs:
      run_android_tests:
        description: Run Room 9 and device tests on Android emulator
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: memora-0945-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and reconstruct Memora 0.9.45 sources
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/memora_0945_source"
          mkdir -p "$project_dir"
          if [[ -f Memora_0.9.45_GitHub.zip ]]; then
            unzip -q Memora_0.9.45_GitHub.zip -d "$project_dir"
          else
            test -f Memora_0.9.44_GitHub.zip
            test -f ci/0945/source_patch.xz.b64
            unzip -q Memora_0.9.44_GitHub.zip -d "$project_dir"
            base64 -d ci/0945/source_patch.xz.b64 > "$RUNNER_TEMP/memora_0945_source.patch.xz"
            printf '%s  %s\n' 'c48b7b59b42761459993baf42975ab724c9941236d13ccd2c9dbf46543b60e63' "$RUNNER_TEMP/memora_0945_source.patch.xz" | sha256sum -c -
            xz -dc "$RUNNER_TEMP/memora_0945_source.patch.xz" | patch -d "$project_dir" -p1 --batch -s
          fi
          test -f "$project_dir/settings.gradle.kts"
          test -f "$project_dir/tools/regression_0945.py"
          grep -q 'versionCode = 66' "$project_dir/app/build.gradle.kts"
          grep -q 'versionName = "0.9.45"' "$project_dir/app/build.gradle.kts"
          PROJECT_DIR="$project_dir" python3 - <<'PY'
          import hashlib, os, pathlib, sys
          root=pathlib.Path(os.environ["PROJECT_DIR"])
          manifest=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"ci/0945/files.sha256"
          expected={}
          for line in manifest.read_text().splitlines():
              sha,relative=line.split("  ",1)
              expected[relative]=sha
          removed=[]
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  relative=p.relative_to(root).as_posix()
                  if relative not in expected:
                      p.unlink()
                      removed.append(relative)
          files=sorted((p for p in root.rglob("*") if p.is_file()), key=lambda p:p.relative_to(root).as_posix())
          incorrect=[]
          h=hashlib.sha256()
          for p in files:
              relative=p.relative_to(root).as_posix()
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              if digest!=expected.get(relative):
                  incorrect.append(relative)
              h.update(relative.encode()+b"\0"+bytes.fromhex(digest))
          digest=h.hexdigest()
          print("Removed stale source files:", removed)
          print("Source files:", len(files), "Tree SHA-256:", digest)
          print("Mismatching paths:", incorrect[:40])
          if len(files)!=286 or incorrect or digest!="ccc66bf712b7ce9e303542d55ed78e21dde23b5e8c4955952ffc9fec5ca59f2b":
              sys.exit("Memora 0.9.45 source tree mismatch")
          PY
          if [[ ! -f Memora_0.9.45_GitHub.zip ]]; then
            ( cd "$project_dir" && zip -qr "$GITHUB_WORKSPACE/Memora_0.9.45_GitHub.zip" . )
          fi
          unzip -tq Memora_0.9.45_GitHub.zip | tail -2
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Publish verified source ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Memora_0.9.45_GitHub.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Memora 0.9.45 source ZIP [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME" || echo '::warning::Could not publish source ZIP'
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Source regression — selection popup and unchanged app features
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/regression_0945.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Billing backend tests
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: npm test

      - name: Kotlin unit tests, lint and debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.45-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Room schema snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.45-room-schemas
          path: ${{ env.PROJECT_DIR }}/app/schemas/com.memora.app.data.local.AppDatabase/*.json
          if-no-files-found: warn
          retention-days: 14

  android-migration-test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Memora project
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/memora_0945_source"
          mkdir -p "$project_dir"
          if [[ -f Memora_0.9.45_GitHub.zip ]]; then
            unzip -q Memora_0.9.45_GitHub.zip -d "$project_dir"
          else
            unzip -q Memora_0.9.44_GitHub.zip -d "$project_dir"
            base64 -d ci/0945/source_patch.xz.b64 | xz -dc | patch -d "$project_dir" -p1 --batch -s
          fi
          test -f "$project_dir/settings.gradle.kts"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run device and Room migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest