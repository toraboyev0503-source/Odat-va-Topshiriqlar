name: Memora Tree Stage 1 Source Audit
on:
  push:
    branches: [memora-tree-stage1]
    paths:
      - '.github/workflows/memora-tree-stage1-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inventory existing Android source
        shell: bash
        run: |
          set -euo pipefail
          zipfile=Memora_0.9.48_GitHub.zip
          test -f "$zipfile"
          test "$(git hash-object "$zipfile")" = 8f4d2d11efa2d8cbf36885984b0aacabfbb48028
          unzip -tq "$zipfile"
          mkdir -p "$RUNNER_TEMP/memora-source"
          unzip -q "$zipfile" -d "$RUNNER_TEMP/memora-source"
          python3 - <<'PY'
          import os, pathlib, shutil, hashlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"memora-source"
          out=pathlib.Path("audit/tree-stage1/source")
          out.mkdir(parents=True,exist_ok=True)
          inventory=[]
          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.is_symlink():
                  continue
              rel=p.relative_to(root)
              inventory.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel.as_posix()}")
              # Only source and schema files, already contained in the repository ZIP.
              if ((rel.as_posix().startswith(("app/src/main/java/","app/src/main/kotlin/","app/src/test/","app/src/androidTest/","app/schemas/")) and p.suffix in (".kt",".java",".json")) or rel.as_posix() in ("app/build.gradle.kts","settings.gradle.kts","app/src/main/AndroidManifest.xml","build.gradle.kts")):
                  target=out/rel
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(p,target)
          pathlib.Path("audit/tree-stage1/inventory.sha256").write_text("\n".join(inventory)+"\n")
          assert any(out.rglob("*.kt")), "No Kotlin source extracted"
          print(f"Source files exported: {sum(p.is_file() for p in out.rglob('*'))}")
          PY
      - name: Store read-only audit snapshot on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/tree-stage1
          if ! git diff --cached --quiet; then
            git commit -m 'Extract Memora 0.9.48 source audit snapshot'
            git push origin HEAD:memora-tree-stage1
          fi
