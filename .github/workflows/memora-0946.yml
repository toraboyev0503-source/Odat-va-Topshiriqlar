name: Memora 0.9.46 Android Build

on:
  push:
    branches: [main, memora-0946-build]
  workflow_dispatch:
    inputs:
      run_android_tests:
        description: Run Room 10 and device tests on Android emulator
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: memora-0946-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Memora 0.9.46 source
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$GITHUB_WORKSPACE"
          if [[ -f Memora_0.9.46_GitHub.zip ]]; then
            echo 'Extracting the Memora 0.9.46 source archive from repository root'
            unzip -tq Memora_0.9.46_GitHub.zip | tail -2
            project_dir="$RUNNER_TEMP/memora_0946_source"
            mkdir -p "$project_dir"
            unzip -q Memora_0.9.46_GitHub.zip -d "$project_dir"
          elif [[ -f Memora_0.9.45_GitHub.zip && -f ci/0946/delta.patch.xz.b64 ]]; then
            echo 'Restoring verified 0.9.46 sources from the 0.9.45 archive and delta'
            project_dir="$RUNNER_TEMP/memora_0946_source"
            mkdir -p "$project_dir"
            unzip -q Memora_0.9.45_GitHub.zip -d "$project_dir"
            base64 -d ci/0946/delta.patch.xz.b64 > "$RUNNER_TEMP/memora_0946_delta.patch.xz"
            printf '%s  %s\n' 'c3b7498f5fedc789496b6ce05cfc40b33d43da1848ac6a1b2c18183670663686' "$RUNNER_TEMP/memora_0946_delta.patch.xz" | sha256sum -c -
            ( cd "$project_dir" && xz -dc "$RUNNER_TEMP/memora_0946_delta.patch.xz" | patch -p1 --batch -s )
          elif [[ -f settings.gradle.kts && -f tools/regression_0946.py ]]; then
            echo 'Using extracted project at repository root'
          elif [[ -f Memora_0.9.45_GitHub.zip && -f ci/0946/delta.patch.xz.b64 ]]; then
            project_dir="$RUNNER_TEMP/memora_0946_source"
            mkdir -p "$project_dir"
            unzip -q Memora_0.9.45_GitHub.zip -d "$project_dir"
            base64 -d ci/0946/delta.patch.xz.b64 | xz -dc | ( cd "$project_dir" && patch -p1 --batch -s )
          elif [[ -f Memora-0.9.46/settings.gradle.kts ]]; then
            project_dir="$GITHUB_WORKSPACE/Memora-0.9.46"
            echo 'Using extracted project in Memora-0.9.46 subfolder'
          else
            echo '::error::Memora 0.9.46 sources missing. Upload Memora_0.9.46_GitHub.zip to the repository root.'
            find . -maxdepth 2 -type f -not -path './.git/*' | sort | head -60
            exit 1
          fi
          if [[ -f "$project_dir/Memora-0.9.46/settings.gradle.kts" ]]; then
            project_dir="$project_dir/Memora-0.9.46"
          fi
          test -f "$project_dir/settings.gradle.kts"
          test -f "$project_dir/tools/regression_0946.py"
          test -f "$project_dir/app/src/main/java/com/memora/app/ui/components/FullCanvasNoteChrome.kt"
          grep -q 'versionCode = 67' "$project_dir/app/build.gradle.kts"
          grep -q 'versionName = "0.9.46"' "$project_dir/app/build.gradle.kts"
          PROJECT_DIR="$project_dir" python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ["PROJECT_DIR"])
          files=sorted((p for p in root.rglob("*") if p.is_file()),key=lambda p:p.relative_to(root).as_posix())
          h=hashlib.sha256()
          for p in files:
              h.update(p.relative_to(root).as_posix().encode()+b"\0"+hashlib.sha256(p.read_bytes()).digest())
          digest=h.hexdigest()
          print("0.9.46 source:",len(files),"files, hash:",digest)
          assert len(files)==297, "Expected 297 source files"
          assert digest=="1c37493729e54bd9bf95f5f72ab080849ba732a7e2086379289be111c5c21225", "Incorrect source tree"
          PY
          if [[ ! -f Memora_0.9.46_GitHub.zip ]]; then
            ( cd "$project_dir" && zip -qr "$GITHUB_WORKSPACE/Memora_0.9.46_GitHub.zip" . )
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Publish verified Memora 0.9.46 ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Memora_0.9.46_GitHub.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Memora 0.9.46 source ZIP [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME" || echo '::warning::Could not publish source ZIP'
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Source regression — O-01 to O-09 and existing functions
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/regression_0946.py

      - name: SQLite scaling benchmark — 140 to 10,000 synthetic notes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/benchmark_0946.py | tee "$GITHUB_WORKSPACE/memora_0946_sqlite_timings.jsonl"

      - name: Upload SQLite benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.46-sqlite-benchmark
          path: memora_0946_sqlite_timings.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Billing backend tests
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: npm test

      - name: Kotlin unit tests, lint and debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.46-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Room schema snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Memora-0.9.46-room-schemas
          path: ${{ env.PROJECT_DIR }}/app/schemas/com.memora.app.data.local.AppDatabase/*.json
          if-no-files-found: warn
          retention-days: 14

  android-migration-test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Memora project
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$GITHUB_WORKSPACE"
          if [[ -f Memora_0.9.46_GitHub.zip ]]; then
            project_dir="$RUNNER_TEMP/memora_0946_source"
            mkdir -p "$project_dir"
            unzip -q Memora_0.9.46_GitHub.zip -d "$project_dir"
          elif [[ -f Memora-0.9.46/settings.gradle.kts ]]; then
            project_dir="$GITHUB_WORKSPACE/Memora-0.9.46"
          fi
          test -f "$project_dir/settings.gradle.kts"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run device and Room migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest